[package]
name = "llm-engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "llm_engine"
path = "src/lib.rs"

[[bin]]
name = "llm-engine"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
axum = "0.8.9"
futures = "0.3.33"
libc = "0.2.189"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.0", features = ["cors"] }
